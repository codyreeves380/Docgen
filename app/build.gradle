plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yourname.docgen'
    compileSdk 37

    defaultConfig {
        applicationId 'com.yourname.docgen'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    // poi-ooxml brings in the POI core and XMLBeans dependencies required by XWPF.
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
}
