plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yourname.docgen'
    compileSdk 37

    defaultConfig {
        applicationId 'com.yourname.docgen'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    packaging {
        resources {
            pickFirsts += 'META-INF/LICENSE.md'
            pickFirsts += 'META-INF/NOTICE.md'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'org.docx4j:docx4j-core:8.3.14'
    implementation 'org.docx4j:docx4j-JAXB-ReferenceImpl:8.3.14'
}
