plugins {
    id 'com.android.application'
    // Your other plugins here...
}

// ADD THIS BLOCK TO FIX THE ERROR:
repositories {
    google()          // Needed for AndroidX and Material Design components
    mavenCentral()    // Needed for Apache POI and XMLBeans
}

android {
    // ADD THIS LINE TO FIX THE ERROR:
    compileSdk 34  

    defaultConfig {
        applicationId "com.example.docgen" // Replace with your actual package name
        minSdk 24                           // Minimum supported Android version
        targetSdk 34                        // Target Android version
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    // Explicitly enforce Java 17 compatibility for your source files
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation 'org.apache.xmlbeans:xmlbeans:5.1.1'
}
