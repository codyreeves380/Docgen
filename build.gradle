plugins {
    id 'com.android.application'
    // Your other plugins here...
}

// ADD THIS BLOCK TO FIX THE ERROR:
repositories {
    google()          // Needed for AndroidX and Material Design components
    mavenCentral()    // Needed for Apache POI and XMLBeans
}

android {
    namespace 'com.example.docgen' // Adjust to your actual package namespace
    compileSdk 34
    // ... rest of your android setup
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation 'org.apache.xmlbeans:xmlbeans:5.1.1'
}
