name: Android CI/CD

on:
  push:
    branches: [ "main" ] # Triggers build every time you save your code
  workflow_dispatch: # Allows you to manually click "Build" on your phone

jobs:
  build:
    runs-on: ubuntu-latest # Spins up a free Linux virtual machine

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Grabs your repository files

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: gradle assembleDebug # Compiles your Java app into an installable APK

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DocumentGenerator-APK
        path: app/build/outputs/apk/debug/app-debug.apk # Grabs the compiled file
