name: Android CI/CD

on:
  push:
    branches: [ "main" ] # Triggers build every time you save your code
  workflow_dispatch: # Allows you to manually click "Build" on your phone

jobs:
  build:
    runs-on: ubuntu-latest # Spins up a free Linux virtual machine

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Grabs your repository files

    - name: Set up Java 5
      uses: actions/setup-java@v4
      with:
        java-version: '5'
        distribution: 'zulu' # Uses Azul Zulu OpenJDK architecture supporting legacy versions

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew # Ensures Linux has permission to run the wrapper script

    - name: Build Debug APK
      run: ./gradlew assembleDebug # Compiles your Java app into an installable APK using the wrapper

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DocumentGenerator-APK
        path: app/build/outputs/apk/debug/app-debug.apk # Grabs the compiled file
